name: CI Optimized

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile.optimized') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # Cache Conan dependencies
      - name: Cache Conan dependencies
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      # Cache build artifacts
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('engine/src/**', 'conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-build-

      # Build with caching
      - name: Build toolchain image with cache
        run: |
          docker buildx create --use
          docker buildx build --cache-from=type=local,src=/tmp/.buildx-cache --cache-to=type=local,dest=/tmp/.buildx-cache -t sleipner-toolchain -f Dockerfile.optimized .

      - name: Check formatting
        run: CONTAINER_CMD=docker ./ci.sh check

      - name: Build
        run: CONTAINER_CMD=docker ./ci.sh build

      - name: Test
        run: CONTAINER_CMD=docker ./ci.sh test

      - name: Lint
        run: CONTAINER_CMD=docker ./ci.sh lint

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-linux-x86_64
          path: build/Release/engine/sleipner

  # Separate job for Android builds (only on main branch)
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Use cached Docker image from build job
      - name: Load Docker image from cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar
          key: docker-image-${{ hashFiles('Dockerfile.optimized') }}

      - name: Load Docker image
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            docker load -i /tmp/docker-image.tar
          else
            docker build -t sleipner-toolchain -f Dockerfile.optimized .
            docker save sleipner-toolchain -o /tmp/docker-image.tar
          fi

      - name: Build Android APK
        run: CONTAINER_CMD=docker ./ci.sh android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-android
          path: build/android/*.apk