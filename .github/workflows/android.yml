name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t sleipner-toolchain .

      - name: Build Android arm64
        run: CONTAINER_CMD=docker ./ci.sh android

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-android-arm64
          path: build/android/arm64-v8a/build/libsleipner.so
