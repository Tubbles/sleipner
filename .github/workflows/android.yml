name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t sleipner-toolchain .

      - name: Build APK
        run: CONTAINER_CMD=docker ./ci.sh apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-android-arm64
          path: android/app/build/outputs/apk/release/*.apk
