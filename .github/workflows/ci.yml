name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build toolchain image with cache
        run: |
          docker buildx create --use
          docker buildx build --cache-from=type=local,src=/tmp/.buildx-cache --cache-to=type=local,dest=/tmp/.buildx-cache -t sleipner-toolchain .

      - name: Check formatting
        run: CONTAINER_CMD=docker ./ci.sh check

      - name: Build
        run: CONTAINER_CMD=docker ./ci.sh build

      - name: Test
        run: CONTAINER_CMD=docker ./ci.sh test

      - name: Lint
        run: CONTAINER_CMD=docker ./ci.sh lint

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-linux-x86_64
          path: build/Release/engine/sleipner
