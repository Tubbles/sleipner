name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sleipner-toolchain
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cache conan packages
      - name: Cache Conan build
        uses: actions/cache@v4
        with:
          path: build/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Check formatting
        run: CONTAINER_CMD=docker ./ci.sh check check.log

      - name: Build
        run: CONTAINER_CMD=docker ./ci.sh build build.log

      - name: Test
        run: CONTAINER_CMD=docker ./ci.sh test test.log

      - name: Lint
        run: CONTAINER_CMD=docker ./ci.sh lint lint.log

      - name: Cppcheck forward-decl addon
        run: CONTAINER_CMD=docker ./ci.sh cppcheck cppcheck.log

      - name: Pytest addon tests
        run: CONTAINER_CMD=docker ./ci.sh pytest pytest.log

      - name: Show logs
        if: always()
        run: |
          for log in tmp/check.log tmp/build.log tmp/test.log tmp/lint.log tmp/cppcheck.log tmp/pytest.log; do
            [ -f "$log" ] && echo "=== $log ===" && cat "$log" || true
          done

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-linux-x86_64
          path: build/Release/engine/sleipner

      - name: Upload gamedata
        uses: actions/upload-artifact@v4
        with:
          name: gamedata
          path: data/gamedata.toml
