name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Check formatting
        run: nix develop -c clang-format --dry-run --Werror engine/src/*.c engine/src/*.h engine/test/*.c

      - name: Configure
        run: nix develop -c cmake --preset linux

      - name: Build
        run: nix develop -c cmake --build --preset linux

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: nix develop -c ctest --preset linux

      - name: Lint
        run: |
          nix develop -c bash -c '
            cd build/Release && \
            clang-tidy -p . $(ls ../../engine/src/*.c ../../engine/test/*.c | grep -v arena_win32)
          '

      - name: Cppcheck forward-decl addon
        run: nix develop -c cppcheck --enable=warning --addon=tools/cppcheck/no_forward_decl.py --suppress=unknownMacro --suppress=normalCheckLevelMaxBranches --error-exitcode=1 engine/src/*.h engine/src/*.c

      - name: Pytest addon tests
        run: nix develop -c pytest tools/cppcheck/test_no_forward_decl.py -v

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sleipner-linux-x86_64
          path: build/Release/engine/sleipner

      - name: Upload gamedata
        uses: actions/upload-artifact@v4
        with:
          name: gamedata
          path: data/gamedata.toml
